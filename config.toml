# luxstatus configuration. Every key is optional; missing keys use these defaults.

[colours]
available   = [0, 255, 0]
tentative   = [255, 180, 0]
busy        = [255, 0, 0]
call        = [255, 0, 0]
call_camera = [255, 0, 0]   # used only if devices.camera_distinct = true
dnd         = [255, 0, 0]
oof         = [0, 0, 0]     # out of office; [0, 0, 0] is off
brightness  = 1.0           # 0.1-1.0, scales every colour on the Flag

[work_hours]
enabled = true
days  = ["Mon", "Tue", "Wed", "Thu", "Fri"]
start = "07:30"
end   = "17:00"

[outlook]
enabled = true
poll_seconds = 30
lookahead_minutes = 240

[session]
enabled = true
poll_seconds = 2

[devices]
enabled = true
poll_seconds = 2
on_debounce_reads = 2
off_debounce_seconds = 10
camera_distinct = false
include = ["MSTeams", "zoom", "webex", "chrome", "msedge", "firefox"]   # empty = any app
exclude = []

[hotkeys]
dnd  = "<ctrl>+<alt>+d"
auto = "<ctrl>+<alt>+a"

[effects]
call_flash = true      # strobe briefly when a call starts, then hold solid
flash_seconds = 2
flash_speed = 20       # lower is faster
flash_repeat = 3

[resolver]
tick_seconds = 5
stale_factor = 3
