[project]
name = "luxstatus"
version = "0.1.0"
description = "Drive a Luxafor Flag from Outlook calendar, mic/camera use and a manual override"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10",
    "psutil>=5.9; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
